# config/sources.yaml — Radar de Editais Dhara / IFA Records
#
# Lista operacional de fontes monitoradas.
# Referência de negócio: docs/03_FONTES_DE_MONITORAMENTO.md
#
# Regras:
# - Esta lista orienta a descoberta. Ela NÃO prova que uma oportunidade está aberta.
# - "url: null" significa que a URL ainda não foi verificada. Não inventar URLs.
# - "dominio" registra um domínio já citado nas regras do repositório, útil para
#   buscas "site:". Não equivale a URL validada.
# - Agregadores (autoridade "agregador") servem para descoberta; status, prazo, valor
#   e elegibilidade devem ser confirmados no regulamento ou na fonte organizadora.
# - Este arquivo NÃO é editado automaticamente pelo radar. Toda alteração (inclusão,
#   remoção, URL ou autoridade) exige aprovação humana e fica no histórico do Git.
#
# Comportamento na primeira rodada real (e enquanto houver url: null):
# 1. Usar primeiro as fontes com URL configurada.
# 2. Para fontes com url: null, buscar a página oficial pelo nome e registrar uma
#    PROPOSTA de URL, com evidência, na seção "Propostas de atualização de fontes"
#    do relatório em data/reports/.
# 3. Não preencher nem alterar este arquivo; a URL só entra aqui após validação humana.

versao: 1
atualizado_em: null   # preencher com AAAA-MM-DD ao revisar

# Níveis de autoridade, do maior para o menor (ver hierarquia em CLAUDE.md)
niveis_autoridade:
  oficial: "Regulamento, página ou plataforma da instituição realizadora"
  parceiro: "Instituição parceira ou correalizadora identificável"
  agregador: "Plataforma que reúne chamadas de terceiros (ex.: PROSAS)"
  midia: "Imprensa, blogs e newsletters"
  rede_social: "Perfis em redes sociais, inclusive institucionais"

# Uso permitido de cada fonte
usos:
  descoberta: "Encontrar candidatas"
  validacao: "Confirmar status, prazo, valor e elegibilidade"

# Frequências aceitas: diaria | semanal | mensal
padrao:
  frequencia: semanal
  idiomas: [pt]
  ativo: true
  status_verificacao: pendente   # pendente | verificada | inacessivel

fontes:

  # ---------------------------------------------------------------
  # Agregadores e plataformas de descoberta
  # ---------------------------------------------------------------
  - id: prosas
    nome: PROSAS
    categoria: agregador_brasil
    abrangencia: nacional
    autoridade: agregador
    prioridade_descoberta: alta
    usos: [descoberta]
    frequencia: diaria
    idiomas: [pt]
    dominio: prosas.com.br   # citado nas consultas do repositório; confirmar URL canônica
    url: null                # preencher somente após confirmação humana
    consultas_sugeridas:
      - "site:prosas.com.br edital música"
      - "site:prosas.com.br oportunidades cultura música"
    status_verificacao: pendente
    notas: >
      Fonte prioritária de descoberta no Brasil. Registrar a URL da oportunidade
      como url_descoberta. A página na PROSAS não pode ser a única evidência de
      status, prazo, valor ou elegibilidade quando houver regulamento ou fonte
      organizadora disponível.

  # ---------------------------------------------------------------
